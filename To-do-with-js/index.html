<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-Do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
   <div class="list">
     <h2 class="font-bold text-2xl ">To-Do List</h2>
    <input type="text" placeholder="Add new Task" class="border-2 border-neutral-200 rounded-xl w-[500px] h-[40px] text-center placeholder:text-center border p-2 ">
    <button class="border-2 border-zinc-300 rounded-xl w-[100px] h-[40px] bg-blue-500 font-semibold text-white">Add task</button>
    <p></p>
   <ul class="mt-4 space-y-2">
  <li class="bg-white p-3 rounded shadow">Sample Task 1 <button  class="delete"><i class="fa-solid fa-trash ml-100 text-red-500"></i></button></i></li>
  <li class="bg-white p-3 rounded shadow">Sample Task 2 <button class="delete"><i class="fa-solid fa-trash ml-100 text-red-500"></i></button></i></li>
  <h2 class="font-bold text-xl">Add your Item that you want</h2>
</ul>
   </div>
    <script src="script.js"></script>
</body>
</html>
